# --- 基础信息 / Basic Information ---
local app_id="auto-x"
local app_name="Auto-X（X Sentinel）"
local app_text="X / 小红书内容监听与 AI 创作管理平台（GitHub 自动更新）"
local app_url="https://github.com/StanXu-symple/auto-x"
local docker_name="x-sentinel"
local docker_app_service="x-sentinel-frontend-1"
local docker_port="8080"
local app_size="8"
local auto_x_install_dir="/home/docker/auto-x"
local auto_x_compose_override="docker-compose.kejilion.yml"
local auto_x_data_routing_override="docker-compose.data-routing.yml"
local auto_x_repo_url="${KJ_AUTO_X_REPO_URL:-}"
local auto_x_git_timeout="${KJ_AUTO_X_GIT_TIMEOUT_SECONDS:-60}"
local auto_x_pull_retries="${KJ_AUTO_X_PULL_RETRIES:-3}"
if [ -z "$auto_x_repo_url" ]; then
    case "${gh_proxy:-}" in
        ""|"https://")
            auto_x_repo_url="https://gh.kejilion.pro/github.com/StanXu-symple/auto-x.git"
            ;;
        *)
            auto_x_repo_url="${gh_proxy}github.com/StanXu-symple/auto-x.git"
            ;;
    esac
fi
# Docker Hub registry-mirrors do not proxy ghcr.io. Use the verified GHCR
# gateway by default, while keeping direct GHCR available as an override.
local auto_x_default_image_registry="ghcr.dockerproxy.net"
local auto_x_image_registry="${KJ_AUTO_X_IMAGE_REGISTRY:-ghcr.dockerproxy.net}"
auto_x_image_registry="${auto_x_image_registry%/}"
local auto_x_backend_image="${auto_x_image_registry}/stanxu-symple/auto-x-backend"
local auto_x_xhs_worker_image="${auto_x_image_registry}/stanxu-symple/auto-x-xhs-worker"
local auto_x_frontend_image="${auto_x_image_registry}/stanxu-symple/auto-x-frontend"
local auto_x_services_file="${auto_x_install_dir}/.auto-x-services"
local auto_x_nacos_config_data_id="x-sentinel-config.json"
local auto_x_nacos_config_group="X_SENTINEL"
# Worker-only nodes do not have the frontend container that kejilion's generic
# update marker historically used. Point the generic lifecycle check at a
# selected, long-running Auto-X service when the node already has a selection.
if [ -f "$auto_x_services_file" ]; then
    case ",$(head -n 1 "$auto_x_services_file" 2>/dev/null)," in
        *,backend,*) docker_app_service="x-sentinel-backend-1" ;;
        *,frontend,*) docker_app_service="x-sentinel-frontend-1" ;;
        *,xhs-worker,*) docker_app_service="x-sentinel-xhs-worker-1" ;;
        *,monitor-center,*) docker_app_service="x-sentinel-monitor-center-1" ;;
        *,monitor-agent,*) docker_app_service="x-sentinel-monitor-agent-1" ;;
    esac
fi

auto_x_source_dir() {
    printf '%s\n' "${KJ_AUTO_X_SOURCE_DIR:-}"
}

auto_x_sync_source() {
    local source_dir
    source_dir="$(auto_x_source_dir)"

    install git || return 1
    if [ -n "$source_dir" ]; then
        if [ ! -f "${source_dir}/docker-compose.yml" ] || [ ! -f "${source_dir}/.env.example" ]; then
            echo "错误: Auto-X 本地项目不完整: ${source_dir}"
            return 1
        fi
        if [ "$(cd -- "$source_dir" && pwd)" = "$(cd -- "$auto_x_install_dir" 2>/dev/null && pwd)" ]; then
            echo "错误: Auto-X 源目录不能与安装目录相同。"
            return 1
        fi

        install rsync || return 1
        mkdir -p "$auto_x_install_dir"
        rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'backups/' \
            --exclude 'data/' \
            --exclude 'logs/' \
            --exclude 'tmp/' \
            --exclude "$auto_x_compose_override" \
            --exclude "$auto_x_data_routing_override" \
            --exclude '.auto-x-services' \
            "${source_dir}/" "${auto_x_install_dir}/"
    elif [ ! -d "${auto_x_install_dir}/.git" ]; then
        if [ -e "$auto_x_install_dir" ] && [ "$(find "$auto_x_install_dir" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "错误: ${auto_x_install_dir} 已存在但不是 Auto-X Git 仓库。"
            echo "如需从 GitHub 接管旧目录，请先备份后删除该目录，或设置 KJ_AUTO_X_SOURCE_DIR 使用本地源。"
            return 1
        fi
        timeout "$auto_x_git_timeout" \
            git clone --depth=1 --branch main "$auto_x_repo_url" "$auto_x_install_dir" || {
            echo "错误: Auto-X 源码下载超时或失败，请检查 GitHub 代理或设置 KJ_AUTO_X_REPO_URL。"
            return 1
        }
    else
        timeout "$auto_x_git_timeout" \
            git -C "$auto_x_install_dir" pull --ff-only "$auto_x_repo_url" main || {
            echo "错误: Auto-X GitHub 仓库更新失败，请检查网络或本地修改。"
            return 1
        }
    fi
}

auto_x_set_env() {
    local key="$1" value="$2" env_file="$3"
    local escaped_value="${value//\\/\\\\}"
    escaped_value="${escaped_value//&/\\&}"
    escaped_value="${escaped_value//|/\\|}"
    if grep -q "^${key}=" "$env_file"; then
        sed -i "s|^${key}=.*|${key}=${escaped_value}|" "$env_file"
    else
        printf '%s=%s\n' "$key" "$value" >> "$env_file"
    fi
}

auto_x_set_env_if_missing() {
    local key="$1" value="$2" env_file="$3"
    if ! grep -q "^${key}=" "$env_file"; then
        printf '%s=%s\n' "$key" "$value" >> "$env_file"
    fi
}

auto_x_set_env_if_default() {
    local key="$1" value="$2" default_value="$3" env_file="$4" current_value
    current_value="$(auto_x_get_env "$key" "$env_file")"
    if [ -z "$current_value" ] || [ "$current_value" = "$default_value" ]; then
        auto_x_set_env "$key" "$value" "$env_file"
    fi
}

auto_x_validate_manage_data() {
    local env_file="$1" requested current
    requested="${KJ_AUTO_X_MANAGE_DATA:-}"
    if [ -n "$requested" ]; then
        case "${requested,,}" in
            true|false)
                auto_x_set_env AUTO_X_MANAGE_DATA "${requested,,}" "$env_file"
                ;;
            *)
                echo "错误: KJ_AUTO_X_MANAGE_DATA 只能设置为 true 或 false。" >&2
                return 1
                ;;
        esac
        return 0
    fi

    current="$(auto_x_get_env AUTO_X_MANAGE_DATA "$env_file")"
    [ -z "$current" ] && return 0
    case "${current,,}" in
        true|false)
            auto_x_set_env AUTO_X_MANAGE_DATA "${current,,}" "$env_file"
            ;;
        *)
            echo "错误: AUTO_X_MANAGE_DATA 只能设置为 true 或 false。" >&2
            return 1
            ;;
    esac
}

auto_x_build_from_source_enabled() {
    case "${KJ_AUTO_X_BUILD_FROM_SOURCE:-}" in
        1|true|TRUE|yes|YES|on|ON) return 0 ;;
        ""|0|false|FALSE|no|NO|off|OFF) return 1 ;;
        *)
            echo "错误: KJ_AUTO_X_BUILD_FROM_SOURCE 只能设置为 1/0 或 true/false。" >&2
            return 2
            ;;
    esac
}

# Read one dotenv value without sourcing .env (values are administrator input).
auto_x_get_env() {
    local key="$1" env_file="$2" line value
    line="$(grep -m1 -E "^${key}=" "$env_file" 2>/dev/null || true)"
    [ -n "$line" ] || return 0
    value="${line#*=}"
    if [ "${#value}" -ge 2 ] && [ "${value:0:1}" = '"' ] && [ "${value: -1}" = '"' ]; then
        value="${value:1:${#value}-2}"
    elif [ "${#value}" -ge 2 ] && [ "${value:0:1}" = "'" ] && [ "${value: -1}" = "'" ]; then
        value="${value:1:${#value}-2}"
    fi
    printf '%s' "$value"
}

# Seed the Nacos Config document through the repository's tested helper. The
# helper reads the dotenv file itself, keeps existing Nacos values authoritative,
# and publishes every application setting, including generated credentials.
# Only the Nacos bootstrap connection remains local so the first read is possible.
auto_x_sync_nacos_config() {
    local env_file="${auto_x_install_dir}/.env"
    local enabled helper="${auto_x_install_dir}/infra/scripts/nacos-config.py"
    enabled="$(auto_x_get_env NACOS_CONFIG_ENABLED "$env_file")"
    case "${enabled,,}" in
        false|0|no|off)
            echo "Nacos Config 已禁用（NACOS_CONFIG_ENABLED=${enabled}）。"
            return 0
            ;;
    esac
    [ -f "$env_file" ] || {
        echo "错误: 找不到 Auto-X 环境文件 ${env_file}。"
        return 1
    }
    if [ -z "$(auto_x_get_env NACOS_PASSWORD "$env_file")" ]; then
        echo "错误: NACOS_PASSWORD 为空，请先在安装器中完成 Nacos 配置。"
        return 1
    fi
    [ -f "$helper" ] || {
        echo "错误: 找不到 Nacos Config 初始化程序 ${helper}。"
        return 1
    }
    if ! command -v python3 >/dev/null 2>&1; then
        echo "未检测到 python3，正在安装以初始化 Nacos Config。"
        install python3 || {
            echo "错误: 无法安装 python3，无法同步 Nacos Config。"
            return 1
        }
    fi
    # The helper reads Nacos bootstrap credentials directly from this protected
    # dotenv file, so the password never appears in the process argument list.
    # --write-bootstrap writes the complete effective document back to .env so
    # Compose can interpolate values before containers start. Application
    # processes still read the authoritative values from Nacos at startup.
    python3 "$helper" --env-file "$env_file" --control-plane-dir \
        "${auto_x_install_dir}/data/control-plane" --write-bootstrap
}

auto_x_prepare_control_plane_bootstrap() {
    local control_dir="${auto_x_install_dir}/data/control-plane"
    mkdir -p "$control_dir"
    bash "${auto_x_install_dir}/infra/scripts/microservices-init.sh" "$control_dir"
}

auto_x_check_nacos() {
    local env_file="$1" helper="${auto_x_install_dir}/infra/scripts/nacos-config.py"
    [ -f "$helper" ] || {
        echo "错误: 找不到 Nacos 配置验证程序 ${helper}。"
        return 1
    }
    if ! command -v python3 >/dev/null 2>&1; then
        echo "未检测到 python3，正在安装以验证 Nacos 配置。"
        install python3 || {
            echo "错误: 无法安装 python3，无法验证 Nacos 配置。"
            return 1
        }
    fi
    case "$(python3 "$helper" --help 2>&1)" in
        *--check*) ;;
        *)
            echo "错误: Auto-X 源码版本过旧，Nacos 验证程序不支持 --check，请先更新源码。"
            return 2
            ;;
    esac
    echo "正在验证 Nacos 地址、账号和密码..."
    python3 "$helper" --env-file "$env_file" --check
}

auto_x_configure_nacos() {
    local env_file="$1" nacos_addr nacos_namespace nacos_user nacos_password nacos_input
    local check_status
    if [ -n "$(auto_x_get_env NACOS_PASSWORD "$env_file")" ] \
        && [ -n "$(auto_x_get_env NACOS_SERVER_ADDR "$env_file")" ] \
        && [ -n "$(auto_x_get_env NACOS_USERNAME "$env_file")" ]; then
        if auto_x_check_nacos "$env_file"; then
            return 0
        else
            check_status=$?
        fi
        [ "$check_status" -ne 2 ] || return 1
    fi

    while true; do
        echo ""
        echo "Auto-X 微服务需要连接 Nacos，请填写 Nacos 配置："
        nacos_addr="$(auto_x_get_env NACOS_SERVER_ADDR "$env_file")"
        read -r -p "Nacos 地址 [${nacos_addr:-http://127.0.0.1:8848}]: " nacos_input
        nacos_addr="${nacos_input:-${nacos_addr:-http://127.0.0.1:8848}}"
        nacos_namespace="$(auto_x_get_env NACOS_NAMESPACE "$env_file")"
        read -r -p "Nacos 命名空间 [${nacos_namespace:-public}]: " nacos_input
        nacos_namespace="${nacos_input:-${nacos_namespace:-public}}"
        nacos_user="$(auto_x_get_env NACOS_USERNAME "$env_file")"
        read -r -p "Nacos 用户名 [${nacos_user:-nacos}]: " nacos_input
        nacos_user="${nacos_input:-${nacos_user:-nacos}}"
        nacos_password="$(auto_x_get_env NACOS_PASSWORD "$env_file")"
        if [ -n "$nacos_password" ]; then
            read -r -s -p "Nacos 密码 [回车保留现有密码]: " nacos_input
            echo ""
            nacos_password="${nacos_input:-$nacos_password}"
        else
            while [ -z "$nacos_password" ]; do
                read -r -s -p "Nacos 密码: " nacos_password
                echo ""
                [ -n "$nacos_password" ] || echo "错误: Nacos 密码不能为空。"
            done
        fi
        auto_x_set_env NACOS_SERVER_ADDR "$nacos_addr" "$env_file"
        auto_x_set_env NACOS_NAMESPACE "$nacos_namespace" "$env_file"
        auto_x_set_env NACOS_USERNAME "$nacos_user" "$env_file"
        auto_x_set_env NACOS_PASSWORD "$nacos_password" "$env_file"
        chmod 600 "$env_file"
        if auto_x_check_nacos "$env_file"; then
            return 0
        else
            check_status=$?
        fi
        [ "$check_status" -ne 2 ] || return 1
        echo "错误: Nacos 连接或认证验证失败，请从地址开始重新填写。"
    done
}

auto_x_random_hex() {
    local bytes="${1:-32}"
    if command -v openssl >/dev/null 2>&1; then
        openssl rand -hex "$bytes"
    else
        head -c "$((bytes * 2))" /dev/urandom | od -An -tx1 | tr -d '[:space:]' | cut -c1-$((bytes * 2))
    fi
}

auto_x_detect_advertise_ip() {
    local address endpoint
    for endpoint in https://api.ipify.org https://ifconfig.me/ip https://icanhazip.com; do
        address="$(curl -4fsS --connect-timeout 3 --max-time 5 "$endpoint" 2>/dev/null)" || continue
        if python3 - "$address" <<'PYIP'
import ipaddress, sys
try:
    ip = ipaddress.ip_address(sys.argv[1].strip())
    sys.exit(0 if ip.version == 4 and ip.is_global else 1)
except ValueError:
    sys.exit(1)
PYIP
        then
            printf '%s' "$address" | tr -d '[:space:]'
            return 0
        fi
    done
    echo "错误: 无法检测本机公网 IPv4，停止安装，避免注册不可达的内网地址。" >&2
    return 1
}

auto_x_prepare_env() {
    local env_file="${auto_x_install_dir}/.env"
    local admin_password service_auth_kek

    if [ ! -f "$env_file" ]; then
        cp "${auto_x_install_dir}/.env.example" "$env_file" || return 1
        chmod 600 "$env_file"
        admin_password="$(auto_x_random_hex 16)" || return 1
        auto_x_set_env APP_PORT "$docker_port" "$env_file"
        auto_x_set_env POSTGRES_PASSWORD "$(auto_x_random_hex 32)" "$env_file"
        auto_x_set_env POSTGRES_EXPORTER_PASSWORD "$(auto_x_random_hex 32)" "$env_file"
        auto_x_set_env REDIS_PASSWORD "$(auto_x_random_hex 32)" "$env_file"
        auto_x_set_env JWT_SECRET_KEY "$(auto_x_random_hex 32)" "$env_file"
        auto_x_set_env X_TOKEN_ENCRYPTION_KEY "$(auto_x_random_hex 32)" "$env_file"
        service_auth_kek="${KJ_AUTO_X_SERVICE_AUTH_KEK:-$(auto_x_random_hex 32)}"
        auto_x_set_env SERVICE_AUTH_KEY_ENCRYPTION_KEY "$service_auth_kek" "$env_file"
        auto_x_set_env ADMIN_PASSWORD "$admin_password" "$env_file"
        auto_x_set_env GRAFANA_ADMIN_PASSWORD "$(auto_x_random_hex 32)" "$env_file"

        AUTO_X_INITIAL_ADMIN_PASSWORD="$admin_password"
    fi

    # Replace only the repository's official defaults; preserve an operator's
    # custom registry or image path. IMAGE_TAG remains untouched so pinned
    # releases continue to work.
    auto_x_set_env_if_default BACKEND_IMAGE "$auto_x_backend_image" \
        "ghcr.io/stanxu-symple/auto-x-backend" "$env_file"
    auto_x_set_env_if_default XHS_WORKER_IMAGE "$auto_x_xhs_worker_image" \
        "ghcr.io/stanxu-symple/auto-x-xhs-worker" "$env_file"
    auto_x_set_env_if_default FRONTEND_IMAGE "$auto_x_frontend_image" \
        "ghcr.io/stanxu-symple/auto-x-frontend" "$env_file"
    auto_x_set_env_if_missing NACOS_SERVER_ADDR "http://127.0.0.1:8848" "$env_file"
    auto_x_set_env_if_missing NACOS_NAMESPACE "public" "$env_file"
    auto_x_set_env_if_missing NACOS_GROUP "X_SENTINEL" "$env_file"
    auto_x_set_env_if_missing NACOS_USERNAME "nacos" "$env_file"
    local advertise_ip
    command -v python3 >/dev/null 2>&1 || install python3 || return 1
    advertise_ip="${KJ_AUTO_X_NACOS_ADVERTISE_IP:-}"
    if [ -z "$advertise_ip" ]; then
        advertise_ip="$(auto_x_detect_advertise_ip)" || return 1
    fi
    auto_x_set_env NACOS_ADVERTISE_IP "$advertise_ip" "$env_file"
    auto_x_set_env_if_missing NACOS_CONFIG_ENABLED "true" "$env_file"
    auto_x_set_env_if_missing NACOS_CONFIG_DATA_ID "$auto_x_nacos_config_data_id" "$env_file"
    auto_x_set_env_if_missing NACOS_CONFIG_GROUP "$(auto_x_get_env NACOS_GROUP "$env_file")" "$env_file"
    auto_x_set_env_if_missing NACOS_CONFIG_TIMEOUT_SECONDS "3" "$env_file"
    auto_x_set_env_if_default NACOS_CONFIG_REQUIRED "true" "false" "$env_file"
    # Data ownership is local to the selected node. A node that runs
    # auth-center owns the Compose PostgreSQL/Redis containers; worker-only
    # nodes automatically use the data endpoint seeded by the first node in
    # Nacos Config.
    if [ -z "$(auto_x_get_env AUTO_X_MANAGE_DATA "$env_file")" ]; then
        if auto_x_service_selected auth-center; then
            auto_x_set_env AUTO_X_MANAGE_DATA "true" "$env_file"
        else
            auto_x_set_env AUTO_X_MANAGE_DATA "false" "$env_file"
        fi
    fi
    # Distributed installs must advertise a reachable address and may point
    # worker/control-plane components at an auth-center on another node. Keep
    # these deployment-specific values in the local dotenv cache rather than
    # publishing them to the shared Nacos document.
    if [ -n "${KJ_AUTO_X_NACOS_ADVERTISE_IP:-}" ]; then
        auto_x_set_env NACOS_ADVERTISE_IP "$KJ_AUTO_X_NACOS_ADVERTISE_IP" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_SERVICE_AUTH_URL:-}" ]; then
        auto_x_set_env SERVICE_AUTH_URL "$KJ_AUTO_X_SERVICE_AUTH_URL" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_MONITOR_NODE_ID:-}" ]; then
        auto_x_set_env MONITOR_NODE_ID "$KJ_AUTO_X_MONITOR_NODE_ID" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_MONITOR_CENTER_URL:-}" ]; then
        auto_x_set_env MONITOR_CENTER_URL "$KJ_AUTO_X_MONITOR_CENTER_URL" "$env_file"
    fi
    # Allow a worker-only node to use the data services owned by the auth/API
    # node. These values are applied before the Nacos bootstrap cache is read;
    # the shared Nacos document remains the source of truth after it is seeded.
    if [ -n "${KJ_AUTO_X_POSTGRES_HOST:-}" ]; then
        auto_x_set_env POSTGRES_HOST "$KJ_AUTO_X_POSTGRES_HOST" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_POSTGRES_PORT:-}" ]; then
        auto_x_set_env POSTGRES_PORT "$KJ_AUTO_X_POSTGRES_PORT" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_REDIS_HOST:-}" ]; then
        auto_x_set_env REDIS_HOST "$KJ_AUTO_X_REDIS_HOST" "$env_file"
    fi
    if [ -n "${KJ_AUTO_X_REDIS_PORT:-}" ]; then
        auto_x_set_env REDIS_PORT "$KJ_AUTO_X_REDIS_PORT" "$env_file"
    fi
    if [ "$(auto_x_get_env AUTO_X_MANAGE_DATA "$env_file")" = "true" ]; then
        auto_x_set_env AUTO_X_DATA_ADDRESS "$advertise_ip" "$env_file"
    fi
    # The installer is a production deployment path. Auth-center deliberately
    # requires its own KEK in production; it must not reuse application secrets
    # that are distributed to every worker. The generated value is published to
    # Nacos so every auth-center replica reads the same key automatically.
    auto_x_set_env ENVIRONMENT "production" "$env_file"
    auto_x_set_env DEBUG "false" "$env_file"
    auto_x_set_env STARTUP_STRICT "true" "$env_file"
    auto_x_set_env AUTO_CREATE_TABLES "false" "$env_file"
    if [ -z "$(auto_x_get_env SERVICE_AUTH_KEY_ENCRYPTION_KEY "$env_file")" ]; then
        service_auth_kek="${KJ_AUTO_X_SERVICE_AUTH_KEK:-$(auto_x_random_hex 32)}"
        auto_x_set_env SERVICE_AUTH_KEY_ENCRYPTION_KEY "$service_auth_kek" "$env_file"
    fi
    service_auth_kek="$(auto_x_get_env SERVICE_AUTH_KEY_ENCRYPTION_KEY "$env_file")"
    if [ "${#service_auth_kek}" -lt 32 ]; then
        echo "错误: SERVICE_AUTH_KEY_ENCRYPTION_KEY 必须至少包含 32 个字符。"
        return 1
    fi
    if [ "$service_auth_kek" = "$(auto_x_get_env X_TOKEN_ENCRYPTION_KEY "$env_file")" ] \
        || [ "$service_auth_kek" = "$(auto_x_get_env JWT_SECRET_KEY "$env_file")" ]; then
        echo "错误: 认证签名 KEK 必须独立，不能与 X_TOKEN_ENCRYPTION_KEY 或 JWT_SECRET_KEY 共用。"
        return 1
    fi
    auto_x_validate_manage_data "$env_file" || return 1
    # Migrate only the repository's former service-port defaults. Explicit
    # operator overrides remain untouched, while fresh and legacy installs use
    # the canonical Nacos-advertised ports.
    auto_x_set_env_if_default BACKEND_HOST_PORT "8200" "8000" "$env_file"
    auto_x_set_env_if_default WORKER_HOST_PORT "8201" "8001" "$env_file"
    auto_x_set_env_if_default AI_WORKER_HOST_PORT "8202" "8002" "$env_file"
    auto_x_set_env_if_default QQ_WORKER_HOST_PORT "8203" "8003" "$env_file"
    # Keep Compose's local database containers and the remote application
    # configuration on the same initial connection coordinates. Operators can
    # later point these at an external PostgreSQL/Redis host in Nacos.
    auto_x_set_env_if_missing POSTGRES_HOST "postgres" "$env_file"
    auto_x_set_env_if_missing POSTGRES_PORT "5432" "$env_file"
    auto_x_set_env_if_missing REDIS_HOST "redis" "$env_file"
    auto_x_set_env_if_missing REDIS_PORT "6379" "$env_file"
    auto_x_set_env_if_missing APP_TIMEZONE "$(auto_x_get_env TZ "$env_file")" "$env_file"
    auto_x_set_env_if_missing DOCKER_SOCKET_GID "$(stat -c '%g' /var/run/docker.sock 2>/dev/null || echo 0)" "$env_file"

    auto_x_configure_nacos "$env_file" || return 1
}

auto_x_prepare_compose_override() {
    mkdir -p \
        "${auto_x_install_dir}/data/postgres" \
        "${auto_x_install_dir}/data/redis" \
        "${auto_x_install_dir}/data/prometheus" \
        "${auto_x_install_dir}/data/grafana" \
        "${auto_x_install_dir}/data/xhs-mcp" \
        "${auto_x_install_dir}/data/xhs-images"

    if [ ! -f "${auto_x_install_dir}/data/control-plane/services.json" ]; then
        bash "${auto_x_install_dir}/infra/scripts/microservices-init.sh" "${auto_x_install_dir}/data/control-plane" || return 1
    fi

    # A dual-node deployment may provide a checked-in topology document. Keep
    # the copied file owned by the unprivileged backend UID for read-only
    # monitor-center/monitor-agent bind mounts.
    if [ -n "${KJ_AUTO_X_TOPOLOGY_FILE:-}" ]; then
        local topology_file="${KJ_AUTO_X_TOPOLOGY_FILE}"
        [ -s "$topology_file" ] || {
            echo "错误: 拓扑文件不存在或为空: ${topology_file}" >&2
            return 1
        }
        if command -v python3 >/dev/null 2>&1; then
            python3 - "$topology_file" <<'PY' || return 1
import json, sys
with open(sys.argv[1], encoding="utf-8") as stream:
    document = json.load(stream)
if not isinstance(document, dict) or not isinstance(document.get("services"), list):
    raise SystemExit("拓扑文件必须是包含 services 数组的 JSON 对象")
PY
        fi
        # `kejilion.sh` defines a function named `install`; use the real
        # system utility here instead of accidentally invoking apt.
        if command install -o 10001 -g 10001 -m 0640 "$topology_file" \
            "${auto_x_install_dir}/data/control-plane/services.json"; then
            :
        else
            cp "$topology_file" "${auto_x_install_dir}/data/control-plane/services.json" || return 1
            if chown 10001:10001 "${auto_x_install_dir}/data/control-plane/services.json" 2>/dev/null; then
                chmod 0640 "${auto_x_install_dir}/data/control-plane/services.json"
            else
                # Topology is non-secret; world-readable mode keeps UID 10001
                # able to read it when the host has no matching numeric user.
                chmod 0644 "${auto_x_install_dir}/data/control-plane/services.json"
            fi
        fi
    fi

    # Compose fragments used for the distributed services attach to named
    # networks.  Create the configured groups before Compose resolves an
    # external network; the plain single-host worker selection keeps the base
    # project networks and does not need this step.
    local needs_control=false service
    IFS=',' read -r -a selected_services <<< "${AUTO_X_SERVICES:-backend,frontend}"
    for service in "${selected_services[@]}"; do
        case "$service" in
            backend|frontend|xhs-worker|auth-center|monitor-center|monitor-agent)
                needs_control=true
                ;;
        esac
    done
    if [ "$needs_control" = true ]; then
        local env_file="${auto_x_install_dir}/.env" network_groups
        local control_network app_network data_network monitoring_network
        network_groups="$(auto_x_get_env NETWORK_GROUPS "$env_file")"
        if [ -z "$network_groups" ]; then
            # Keep the network creation contract in sync with the names used
            # by the Compose fragments, including operator-defined names.
            control_network="$(auto_x_get_env CONTROL_NETWORK_NAME "$env_file")"
            app_network="$(auto_x_get_env APP_NETWORK_NAME "$env_file")"
            data_network="$(auto_x_get_env DATA_NETWORK_NAME "$env_file")"
            monitoring_network="$(auto_x_get_env MONITORING_NETWORK_NAME "$env_file")"
            network_groups="${control_network:-x-sentinel-control},${app_network:-x-sentinel_app},${data_network:-x-sentinel_data},${monitoring_network:-x-sentinel_monitoring}"
        fi
        NETWORK_GROUPS="$network_groups" \
            bash "${auto_x_install_dir}/infra/scripts/network-groups.sh" || return 1
    fi

    # The Redis service runs as UID/GID 999:1000.  Bind mounts do not inherit
    # the ownership that the official image gives its /data directory.
    chown -R 999:1000 "${auto_x_install_dir}/data/redis" || {
        echo "错误: 无法将 Redis 数据目录设置为 999:1000，请检查文件系统权限。"
        return 1
    }

    cat > "${auto_x_install_dir}/${auto_x_compose_override}" <<'YML'
services:
  postgres:
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  redis:
    volumes:
      - ./data/redis:/data
  prometheus:
    volumes:
      - ./data/prometheus:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
  grafana:
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
YML

    local build_from_source_status
    if auto_x_build_from_source_enabled; then
        local build_core_service="" build_xhs=false build_frontend=false
        for service in "${selected_services[@]}"; do
            case "$service" in
                backend|worker|ai-worker|qq-worker|auth-center|monitor-center|monitor-agent)
                    [ -n "$build_core_service" ] || build_core_service="$service"
                    ;;
                xhs-worker) build_xhs=true ;;
                frontend) build_frontend=true ;;
            esac
        done

        # Build one representative service for each image. All ordinary
        # services share BACKEND_IMAGE, while xhs-worker and frontend have
        # their own Dockerfile targets/images.
        if [ -n "$build_core_service" ] || [ "$build_xhs" = true ] || [ "$build_frontend" = true ]; then
            {
                if [ -n "$build_core_service" ]; then
                    cat <<YML
  ${build_core_service}:
    build:
      context: ./backend
      target: core
    pull_policy: never
YML
                    if [ -n "${KJ_AUTO_X_MONITOR_CENTER_URL:-}" ] \
                        && [[ "$build_core_service" =~ ^(backend|worker|ai-worker|qq-worker)$ ]]; then
                        cat <<'YML'
    environment:
      MONITOR_CENTER_URL: ${MONITOR_CENTER_URL:-}
YML
                    fi
                fi
                if [ "$build_xhs" = true ]; then
                    cat <<'YML'
  xhs-worker:
    build:
      context: ./backend
      target: xhs-worker
    pull_policy: never
YML
                fi
                if [ "$build_frontend" = true ]; then
                    cat <<'YML'
  frontend:
    build:
      context: ./frontend
    pull_policy: never
YML
                fi
            } >> "${auto_x_install_dir}/${auto_x_compose_override}"
        fi
    else
        build_from_source_status=$?
        [ "$build_from_source_status" -eq 1 ] || return "$build_from_source_status"
        if [ -n "${KJ_AUTO_X_MONITOR_CENTER_URL:-}" ]; then
            local monitor_env_service=""
            for service in "${selected_services[@]}"; do
                case "$service" in
                    backend|worker|ai-worker|qq-worker)
                        monitor_env_service="$service"
                        break
                        ;;
                esac
            done
            if [ -n "$monitor_env_service" ]; then
                cat >> "${auto_x_install_dir}/${auto_x_compose_override}" <<YML
  ${monitor_env_service}:
    environment:
      MONITOR_CENTER_URL: \${MONITOR_CENTER_URL:-}
YML
            fi
        fi
    fi

    auto_x_prepare_data_routing_override || return 1
}

auto_x_prepare_data_routing_override() {
    local env_file="${auto_x_install_dir}/.env"
    local routing_file="${auto_x_install_dir}/${auto_x_data_routing_override}"
    local manage_data data_address postgres_host redis_host
    rm -f "$routing_file"
    manage_data="$(auto_x_get_env AUTO_X_MANAGE_DATA "$env_file")"
    [ "${manage_data,,}" = false ] || return 0
    data_address="$(auto_x_get_env AUTO_X_DATA_ADDRESS "$env_file")"
    [ -n "$data_address" ] || return 0
    if ! command -v python3 >/dev/null 2>&1 \
        || ! python3 - "$data_address" <<'PY'
import ipaddress
import sys
ipaddress.ip_address(sys.argv[1])
PY
    then
        echo "错误: AUTO_X_DATA_ADDRESS 必须是有效的 IPv4 或 IPv6 地址。" >&2
        return 1
    fi
    postgres_host="$(auto_x_get_env POSTGRES_HOST "$env_file")"
    redis_host="$(auto_x_get_env REDIS_HOST "$env_file")"
    [ "$postgres_host" = postgres ] || [ "$redis_host" = redis ] || return 0
    [ -n "$postgres_host" ] && [ -n "$redis_host" ] || {
        echo "错误: 外部数据模式需要同时设置 POSTGRES_HOST 和 REDIS_HOST。" >&2
        return 1
    }
    # Compose's mapping form keeps the logical host names used by Nacos while
    # avoiding tc-2's container-to-own-public-IP hairpin route.
    cat > "$routing_file" <<YML
services:
  migrate:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  backend:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  worker:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  ai-worker:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  qq-worker:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  xhs-worker:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
  auth-center:
    extra_hosts:
      "${postgres_host}": "${data_address}"
      "${redis_host}": "${data_address}"
YML
    chmod 0640 "$routing_file"
}

auto_x_load_selected_services() {
    local selected
    [ -z "${AUTO_X_SERVICES:-}" ] || return 0
    [ -f "$auto_x_services_file" ] || return 0

    selected="$(head -n 1 "$auto_x_services_file")"
    [ -n "$selected" ] || return 0
    AUTO_X_SERVICES="$selected"
    export AUTO_X_SERVICES
}

auto_x_uses_external_data() {
    local env_file="${auto_x_install_dir}/.env"
    local postgres_dsn redis_url postgres_host redis_host manage_data
    local postgres_external=false redis_external=false
    manage_data="$(auto_x_get_env AUTO_X_MANAGE_DATA "$env_file")"
    case "${manage_data,,}" in
        true) return 1 ;;
        false) return 0 ;;
        "") ;;
        *)
            echo "错误: AUTO_X_MANAGE_DATA 只能设置为 true 或 false。" >&2
            return 2
            ;;
    esac
    postgres_dsn="$(auto_x_get_env POSTGRES_DSN "$env_file")"
    redis_url="$(auto_x_get_env REDIS_URL "$env_file")"
    postgres_host="$(auto_x_get_env POSTGRES_HOST "$env_file")"
    redis_host="$(auto_x_get_env REDIS_HOST "$env_file")"

    if [ -n "$postgres_dsn" ] \
        || { [ -n "$postgres_host" ] && [ "$postgres_host" != "postgres" ]; }; then
        postgres_external=true
    fi
    if [ -n "$redis_url" ] \
        || { [ -n "$redis_host" ] && [ "$redis_host" != "redis" ]; }; then
        redis_external=true
    fi

    if [ "$postgres_external" = true ] && [ "$redis_external" = true ]; then
        return 0
    fi
    if [ "$postgres_external" != "$redis_external" ]; then
        echo "错误: PostgreSQL 与 Redis 必须同时使用本机容器，或同时指向共享外部服务。" >&2
        return 2
    fi
    return 1
}

auto_x_report_data_topology() {
    local status
    if auto_x_uses_external_data; then
        echo "数据拓扑: 使用共享外部 PostgreSQL 与 Redis；已启用多节点认证数据存储。"
        return 0
    else
        status=$?
    fi
    [ "$status" -ne 2 ] || return 1
    if auto_x_service_selected auth-center; then
        echo "提示: 当前 auth-center 使用本机 PostgreSQL/Redis，仅适合单主机。"
        echo "      部署第二个 auth-center 前，必须在 Nacos 中同时配置跨主机可达的 PostgreSQL 与 Redis，"
        echo "      安装器会把 SERVICE_AUTH_KEY_ENCRYPTION_KEY 发布到 Nacos，其他节点自动复用。"
    fi
}

auto_x_compose() {
    auto_x_load_selected_services
    local compose_files=("${auto_x_install_dir}/docker-compose.yml" "${auto_x_install_dir}/${auto_x_compose_override}")
    local service fragment added_fragments="," external_data=false external_status
    if auto_x_uses_external_data; then
        external_data=true
    else
        external_status=$?
        [ "$external_status" -ne 2 ] || return 1
    fi
    IFS=',' read -r -a selected_services <<< "${AUTO_X_SERVICES:-backend,frontend}"
    for service in "${selected_services[@]}"; do
        case "$service" in
            backend|frontend) fragment="docker-compose.backend.yml" ;;
            xhs-worker) fragment="docker-compose.xhs-worker.yml" ;;
            auth-center) fragment="docker-compose.auth-center.yml" ;;
            monitor-center) fragment="docker-compose.monitor-center.yml" ;;
            monitor-agent) fragment="docker-compose.monitor-agent.yml" ;;
            worker|ai-worker|qq-worker) fragment="" ;;
            *) echo "错误: 未知服务 ${service}" >&2; return 1 ;;
        esac
        if [ -n "$fragment" ] && [[ "$added_fragments" != *",${fragment},"* ]]; then
            compose_files+=("${auto_x_install_dir}/${fragment}")
            added_fragments+="${fragment},"
        fi
    done
    # Keep this override last so its production/fail-closed data settings win
    # over component fragments. This is required for multiple auth-center
    # replicas to share one PostgreSQL/Redis authority across Docker hosts.
    if [ "$external_data" = true ]; then
        compose_files+=("${auto_x_install_dir}/docker-compose.external.yml")
    fi
    if [ -f "${auto_x_install_dir}/${auto_x_data_routing_override}" ]; then
        compose_files+=("${auto_x_install_dir}/${auto_x_data_routing_override}")
    fi
    docker compose $(printf -- '-f %q ' "${compose_files[@]}") --project-directory "$auto_x_install_dir" "$@"
}

auto_x_compose_pull_with_retries() {
    local attempt
    for ((attempt = 1; attempt <= auto_x_pull_retries; attempt++)); do
        if auto_x_compose pull "$@"; then
            return 0
        fi
        if [ "$attempt" -lt "$auto_x_pull_retries" ]; then
            echo "Docker 镜像源暂时不可用，${attempt}/${auto_x_pull_retries} 次失败，${attempt} 秒后重试。"
            sleep "$attempt"
        fi
    done
    return 1
}

auto_x_replace_default_proxy_image() {
    local key="$1" image_name="$2" env_file="$3" current_value
    current_value="$(auto_x_get_env "$key" "$env_file")"
    [ "$current_value" = "${auto_x_default_image_registry}/stanxu-symple/${image_name}" ] || return 1
    auto_x_set_env "$key" "ghcr.io/stanxu-symple/${image_name}" "$env_file"
}

auto_x_fallback_to_official_images() {
    local env_file="${auto_x_install_dir}/.env" changed=false
    local include_frontend=false include_xhs_worker=false service
    # A custom registry or image path is an operator decision. Only replace
    # values that still exactly match the installer's built-in proxy defaults
    # and are needed by this pull. Every selectable service uses the backend
    # image directly or through its migration/API dependency.
    [ "$auto_x_image_registry" = "$auto_x_default_image_registry" ] || return 1
    [ -f "$env_file" ] || return 1
    if [ "$#" -eq 0 ]; then
        include_frontend=true
        include_xhs_worker=true
    else
        for service in "$@"; do
            case "$service" in
                frontend) include_frontend=true ;;
                xhs-worker) include_xhs_worker=true ;;
            esac
        done
    fi
    if auto_x_replace_default_proxy_image BACKEND_IMAGE auto-x-backend "$env_file"; then
        changed=true
    fi
    if [ "$include_xhs_worker" = true ] \
        && auto_x_replace_default_proxy_image XHS_WORKER_IMAGE auto-x-xhs-worker "$env_file"; then
        changed=true
    fi
    if [ "$include_frontend" = true ] \
        && auto_x_replace_default_proxy_image FRONTEND_IMAGE auto-x-frontend "$env_file"; then
        changed=true
    fi
    [ "$changed" = true ]
}

auto_x_compose_pull() {
    if auto_x_compose_pull_with_retries "$@"; then
        return 0
    fi
    if ! auto_x_fallback_to_official_images "$@"; then
        return 1
    fi
    echo "默认 GHCR 镜像代理拉取失败，正在改用官方 ghcr.io 镜像重试。"
    auto_x_compose_pull_with_retries "$@"
}

# Skip registry access only when the operator explicitly requests an offline
# install/update and every image required by the selected services is already
# present locally. This keeps the normal pull-and-fallback behavior unchanged.
auto_x_skip_pull_enabled() {
    case "${KJ_AUTO_X_SKIP_PULL:-}" in
        1|true|TRUE|yes|YES|on|ON) return 0 ;;
        ""|0|false|FALSE|no|NO|off|OFF) return 1 ;;
        *)
            echo "错误: KJ_AUTO_X_SKIP_PULL 只能设置为 1/0 或 true/false。" >&2
            return 2
            ;;
    esac
}

auto_x_verify_local_images() {
    local env_file="${auto_x_install_dir}/.env"
    local image_tag="$(auto_x_get_env IMAGE_TAG "$env_file")"
    local image service
    local -a required_images=(
        "$(auto_x_get_env BACKEND_IMAGE "$env_file"):${image_tag:-latest}"
    )
    IFS=',' read -r -a selected_services <<< "${AUTO_X_SERVICES:-backend,frontend}"
    for service in "${selected_services[@]}"; do
        case "$service" in
            xhs-worker)
                required_images+=("$(auto_x_get_env XHS_WORKER_IMAGE "$env_file"):${image_tag:-latest}")
                ;;
            frontend)
                required_images+=("$(auto_x_get_env FRONTEND_IMAGE "$env_file"):${image_tag:-latest}")
                ;;
        esac
    done
    if ! auto_x_uses_external_data; then
        required_images+=("postgres:17-alpine" "redis:7.4-alpine" "alpine:3.22")
    fi
    for image in "${required_images[@]}"; do
        [ -n "$image" ] || {
            echo "错误: 无法确定离线部署所需镜像。" >&2
            return 1
        }
        if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "错误: 离线部署缺少镜像 ${image}，请先加载镜像或取消 KJ_AUTO_X_SKIP_PULL。" >&2
            return 1
        fi
    done
}

auto_x_pull_selected_images() {
    auto_x_skip_pull_enabled
    local skip_status=$?
    case "$skip_status" in
        0)
            auto_x_verify_local_images || return 1
            echo "已启用离线镜像模式，跳过 Docker registry 拉取。"
            return 0
            ;;
        1)
            auto_x_compose_pull "${AUTO_X_SERVICE_ARGS[@]}"
            return $?
            ;;
        *)
            return "$skip_status"
            ;;
    esac
}

auto_x_build_from_source() {
    auto_x_build_from_source_enabled
    local requested_status=$?
    [ "$requested_status" -eq 0 ] || {
        [ "$requested_status" -eq 1 ] && return 0
        return "$requested_status"
    }
    local -a build_services=(backend)
    local service
    IFS=',' read -r -a selected_services <<< "${AUTO_X_SERVICES:-backend,frontend}"
    for service in "${selected_services[@]}"; do
        case "$service" in
            xhs-worker) build_services+=(xhs-worker) ;;
            frontend) build_services+=(frontend) ;;
        esac
    done
    echo "已启用源码构建模式，构建本次节点需要的镜像: ${build_services[*]}"
    # Pull base images while building the Dockerfiles. Do not run `compose
    # pull` afterwards: that would replace freshly built service tags.
    auto_x_compose build --pull "${build_services[@]}"
}

auto_x_selected_args() { IFS=',' read -r -a AUTO_X_SERVICE_ARGS <<< "${AUTO_X_SERVICES:-backend,frontend}"; }

auto_x_normalize_services() {
    local raw="$1" service normalized=""
    local -a services
    IFS=',' read -r -a services <<< "$raw"
    for service in "${services[@]}"; do
        service="${service#"${service%%[![:space:]]*}"}"
        service="${service%"${service##*[![:space:]]}"}"
        [ -n "$service" ] || continue
        if [ "$service" = "all" ]; then
            printf '%s' "backend,frontend,worker,ai-worker,qq-worker,xhs-worker,auth-center,monitor-center,monitor-agent"
            return 0
        fi
        case "$service" in
            backend|frontend|worker|ai-worker|qq-worker|xhs-worker|auth-center|monitor-center|monitor-agent) ;;
            *)
                echo "错误: 未知服务 ${service}" >&2
                return 1
                ;;
        esac
        case ",${normalized}," in
            *,"$service",*) continue ;;
        esac
        normalized="${normalized:+${normalized},}${service}"
    done
    if [ -z "$normalized" ]; then
        echo "错误: 至少需要选择一个 Auto-X 服务。" >&2
        return 1
    fi
    printf '%s' "$normalized"
}

auto_x_service_selected() {
    case ",${AUTO_X_SERVICES:-}," in
        *,"$1",*) return 0 ;;
        *) return 1 ;;
    esac
}

auto_x_add_required_service() {
    local service="$1"
    case ",${AUTO_X_SERVICES:-}," in
        *,"$service",*) return 0 ;;
        *) AUTO_X_SERVICES="${AUTO_X_SERVICES:+${AUTO_X_SERVICES},}${service}" ;;
    esac
}

auto_x_add_service_dependencies() {
    local selected=",${AUTO_X_SERVICES:-},"
    # The browser-facing API delegates administrator authentication to the auth
    # center.  XHS and monitor-center can use an auth-center on another node;
    # their SERVICE_AUTH_URL is supplied by the operator and their credentials
    # are synchronized through the shared control-plane bootstrap.  Do not
    # silently add a second auth-center replica to worker/monitor nodes.
    case "$selected" in
        *,backend,*|*,frontend,*)
            auto_x_add_required_service auth-center
            ;;
    esac
    auto_x_add_required_service monitor-agent
}

auto_x_select_services() {
    local persist="${1:-true}"
    local selected="${AUTO_X_SERVICES:-}"
    if [ -f "$auto_x_services_file" ] && [ -z "$selected" ]; then
        selected="$(cat "$auto_x_services_file")"
    fi
    if [ -z "$selected" ]; then
        echo "请选择要部署的服务（逗号分隔，all 表示全部）："
        echo "  backend,frontend,worker,ai-worker,qq-worker,xhs-worker,auth-center,monitor-center"
        echo "  monitor-agent（必装，自动加入）"
        read -r -p "服务 [backend,frontend,auth-center,monitor-agent]: " selected
        selected="${selected:-backend,frontend,auth-center,monitor-agent}"
    fi
    selected="$(auto_x_normalize_services "$selected")" || return 1
    AUTO_X_SERVICES="$selected"
    local before_dependencies="$AUTO_X_SERVICES"
    auto_x_add_service_dependencies
    if [[ ",${before_dependencies}," != *,monitor-agent,* ]]; then
        echo "monitor-agent 为每台主机必装服务，已自动加入本次部署。"
    fi
    if [[ ",${before_dependencies}," != *,auth-center,* ]] \
        && [[ ",${AUTO_X_SERVICES}," == *,auth-center,* ]]; then
        echo "所选服务依赖统一认证中心，已自动加入 auth-center。"
    fi
    selected="$AUTO_X_SERVICES"
    export AUTO_X_SERVICES
    if [ "$persist" = "true" ]; then
        printf '%s\n' "$selected" > "$auto_x_services_file"
    fi
}

# docker_app_plus invokes this hook before asking for a public application port.
# Nodes without the backend service therefore skip that irrelevant prompt.
docker_app_prepare_install() {
    [ "${app_id:-}" = "auto-x" ] || return 0
    echo "注意: monitor-agent 是每台 Docker 主机的必装服务，安装器会自动加入。"
    auto_x_select_services false
}

docker_app_install_requires_port() {
    [ "${app_id:-}" = "auto-x" ] || return 0
    auto_x_service_selected backend
}

auto_x_show_install_info() {
    local admin_password="${AUTO_X_INITIAL_ADMIN_PASSWORD:-}"
    echo ""
    echo "========================================"
    echo "  Auto-X 安装完成"
    echo "========================================"
    echo "  管理面板: http://$(hostname -I | awk '{print $1}'):${docker_port}"
    echo "  管理员账号: admin"
    if [ -n "$admin_password" ]; then
        echo "  管理员密码: ${admin_password}"
    else
        echo "  管理员密码: 请查看 ${auto_x_install_dir}/.env"
    fi
    echo "  配置文件: ${auto_x_install_dir}/.env"
    echo "  数据目录: ${auto_x_install_dir}/data"
    echo "========================================"
    echo ""
}

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    auto_x_sync_source || return 1
    auto_x_select_services || return 1
    auto_x_prepare_env || return 1
    auto_x_prepare_control_plane_bootstrap || return 1
    auto_x_sync_nacos_config || return 1
    auto_x_report_data_topology || return 1
    auto_x_prepare_compose_override || return 1
    auto_x_selected_args
    auto_x_compose config --quiet || return 1
    auto_x_build_from_source || return 1
    if auto_x_build_from_source_enabled; then
        :
    else
        build_from_source_status=$?
        [ "$build_from_source_status" -eq 1 ] || return "$build_from_source_status"
        auto_x_pull_selected_images || return 1
    fi
    auto_x_compose up -d --no-build --wait "${AUTO_X_SERVICE_ARGS[@]}" || return 1
    auto_x_show_install_info
    check_docker_app_ip
}

docker_app_update() {
    [ -f "${auto_x_install_dir}/.env" ] || {
        echo "错误: Auto-X 尚未安装，请先选择安装。"
        return 1
    }
    auto_x_sync_source || return 1
    auto_x_select_services || return 1
    auto_x_prepare_env || return 1
    auto_x_prepare_control_plane_bootstrap || return 1
    auto_x_sync_nacos_config || return 1
    auto_x_report_data_topology || return 1
    auto_x_prepare_compose_override || return 1
    auto_x_selected_args
    auto_x_compose config --quiet || return 1
    auto_x_build_from_source || return 1
    # Pull before stopping the browser worker so a failed download leaves the service running.
    if auto_x_build_from_source_enabled; then
        :
    else
        build_from_source_status=$?
        [ "$build_from_source_status" -eq 1 ] || return "$build_from_source_status"
        auto_x_pull_selected_images || return 1
    fi
    auto_x_compose stop --timeout 45 "${AUTO_X_SERVICE_ARGS[@]}" || return 1
    auto_x_compose up -d --no-build --remove-orphans --wait "${AUTO_X_SERVICE_ARGS[@]}" || {
        # Best-effort rollback: only restart services that the operator chose
        # for this update instead of unexpectedly starting xhs-worker.
        auto_x_compose start "${AUTO_X_SERVICE_ARGS[@]}" >/dev/null 2>&1 || true
        return 1
    }
    docker rm -f x-sentinel-xiaohongshu-mcp-1 2>/dev/null || true
    docker image rm xpzouying/xiaohongshu-mcp:latest 2>/dev/null || true
    rm -rf "${auto_x_install_dir}/data/xhs-mcp" "${auto_x_install_dir}/data/xhs-images"
    echo "Auto-X 已从 GitHub 项目更新完成。"
}

docker_app_uninstall() {
    if [ -f "${auto_x_install_dir}/docker-compose.yml" ] && [ -f "${auto_x_install_dir}/${auto_x_compose_override}" ]; then
        auto_x_compose down --volumes --rmi local --remove-orphans || return 1
    fi
    rm -rf "$auto_x_install_dir"
    echo "Auto-X 已卸载，容器、镜像及 ${auto_x_install_dir} 数据均已删除。"
}

