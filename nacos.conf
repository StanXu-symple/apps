# --- 基础信息 / Basic Information ---
local app_id="nacos"
local app_name="Nacos"
local app_text="Nacos 注册中心与配置中心，支持稳定版和内存最小版 Docker 部署。"
local app_url="https://nacos.io/"
local docker_name="nacos"
local docker_port="${docker_port:-8848}"
local app_size="2"
local nacos_dir="/home/docker/nacos"
local nacos_variant_file="${nacos_dir}/.variant"
local nacos_env_file="${nacos_dir}/.env"

# --- 版本与鉴权配置 / Version and Authentication ---
nacos_load_variant() {
    local saved_variant=""

    if [ -f "$nacos_variant_file" ]; then
        saved_variant="$(tr -d '[:space:]' < "$nacos_variant_file")"
    fi

    # 兼容通过旧版 kejilion.sh 或手工 docker run 创建的 Nacos 容器。
    if [ -z "$saved_variant" ] && docker inspect "$docker_name" >/dev/null 2>&1; then
        case "$(docker inspect --format '{{.Config.Image}}' "$docker_name" 2>/dev/null)" in
            *nacos-server:*slim) saved_variant="minimal" ;;
            *) saved_variant="stable" ;;
        esac
    fi

    case "$saved_variant" in
        minimal) nacos_variant="minimal" ;;
        *) nacos_variant="stable" ;;
    esac
}

nacos_choose_variant() {
    local variant_choice=""
    nacos_load_variant

    if [ -f "$nacos_variant_file" ] || docker inspect "$docker_name" >/dev/null 2>&1; then
        return 0
    fi

    if [ "${KJ_APP_NONINTERACTIVE:-}" = "1" ]; then
        nacos_variant="stable"
    else
        while true; do
            echo "请选择 Nacos 镜像版本:"
            echo "1. 稳定版（nacos/nacos-server:latest）"
            echo "2. 内存最小版（nacos/nacos-server:latest-slim）"
            read -e -p "请输入你的选择 [1-2，默认1]: " variant_choice
            case "${variant_choice:-1}" in
                1) nacos_variant="stable"; break ;;
                2) nacos_variant="minimal"; break ;;
                *) echo "无效的选择，请输入 1 或 2。" ;;
            esac
        done
    fi

    mkdir -p "$nacos_dir" || return 1
    printf '%s\n' "$nacos_variant" > "$nacos_variant_file" || return 1
    chmod 600 "$nacos_variant_file" || return 1
}

nacos_random_hex() {
    local bytes="${1:-16}"
    if command -v openssl >/dev/null 2>&1; then
        openssl rand -hex "$bytes"
    else
        head -c "$bytes" /dev/urandom | od -An -tx1 | tr -d '[:space:]'
    fi
}

nacos_prepare_env() {
    local variant="$1"
    local auth_token=""
    local identity_value=""
    local image="nacos/nacos-server:latest"
    local jvm_xms="1g"
    local jvm_xmx="1g"
    local jvm_xmn="512m"

    mkdir -p "${nacos_dir}/data" "${nacos_dir}/logs" || return 1
    if [ "$variant" = "minimal" ]; then
        image="nacos/nacos-server:latest-slim"
        jvm_xms="256m"
        jvm_xmx="256m"
        jvm_xmn="128m"
    fi

    if [ -f "$nacos_env_file" ]; then
        return 0
    fi

    auth_token="$(nacos_random_hex 32 | base64 | tr -d '[:space:]')"
    identity_value="$(nacos_random_hex 16)"
    [ -n "$auth_token" ] && [ -n "$identity_value" ] || {
        echo "错误: 无法生成 Nacos 鉴权参数"
        return 1
    }

    cat > "$nacos_env_file" <<EOF
NACOS_IMAGE=${image}
NACOS_PORT=${docker_port}
NACOS_AUTH_ENABLE=true
NACOS_AUTH_TOKEN=${auth_token}
NACOS_AUTH_IDENTITY_KEY=nacos
NACOS_AUTH_IDENTITY_VALUE=${identity_value}
JVM_XMS=${jvm_xms}
JVM_XMX=${jvm_xmx}
JVM_XMN=${jvm_xmn}
EOF
    chmod 600 "$nacos_env_file"
}

nacos_write_compose() {
    local variant="$1"
    local console_port_args=""

    # Nacos 3.x latest 的控制台在 8080；latest-slim 为兼容旧版 2.x 的精简镜像，控制台仍在 8848。
    if [ "$variant" = "stable" ]; then
        console_port_args='      - "8080:8080"'
    fi

    cat > "${nacos_dir}/docker-compose.yml" <<EOF
services:
  nacos:
    image: \${NACOS_IMAGE}
    container_name: ${docker_name}
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "\${NACOS_AUTH_ENABLE}"
      NACOS_AUTH_TOKEN: "\${NACOS_AUTH_TOKEN}"
      NACOS_AUTH_IDENTITY_KEY: "\${NACOS_AUTH_IDENTITY_KEY}"
      NACOS_AUTH_IDENTITY_VALUE: "\${NACOS_AUTH_IDENTITY_VALUE}"
      JVM_XMS: "\${JVM_XMS}"
      JVM_XMX: "\${JVM_XMX}"
      JVM_XMN: "\${JVM_XMN}"
    ports:
      - "\${NACOS_PORT}:8848"
      - "9848:9848"
${console_port_args}
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
EOF
}

nacos_print_info() {
    ip_address
    echo "Nacos API: http://$ipv4_address:${docker_port}"
    nacos_load_variant
    if [ "$nacos_variant" = "minimal" ]; then
        echo "Nacos 控制台: http://$ipv4_address:${docker_port}/nacos/index.html"
    else
        echo "Nacos 控制台: http://$ipv4_address:8080/index.html"
    fi
    echo "首次进入控制台时，请初始化 nacos 管理员密码。"
    echo "鉴权参数: ${nacos_env_file}"
}

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local nacos_variant=""

    nacos_choose_variant || return 1
    nacos_prepare_env "$nacos_variant" || return 1
    nacos_write_compose "$nacos_variant" || return 1
    cd "$nacos_dir" || return 1
    docker compose config -q || return 1
    docker compose up -d --remove-orphans || return 1

    echo "Nacos 已经安装完成（${nacos_variant}）"
    nacos_print_info
    check_docker_app_ip
}

docker_app_update() {
    cd "$nacos_dir" || return 1
    [ -f docker-compose.yml ] && [ -f .env ] || {
        echo "错误: Nacos 尚未安装，请先选择安装。"
        return 1
    }
    docker compose config -q || return 1
    docker compose pull || return 1
    docker compose up -d --remove-orphans || return 1
    echo "Nacos 已经更新完成"
    nacos_print_info
}

docker_app_uninstall() {
    cd "$nacos_dir" || return 1
    docker compose down --rmi all || return 1
    rm -rf "$nacos_dir"
    echo "Nacos 已经卸载完成"
}

